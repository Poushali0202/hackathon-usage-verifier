    <path d="M68 52 Q82 55.5 86 60.5 Q82 65.5 68 69 Z" fill="#1E1A34"/>
    <circle cx="58" cy="60.5" r="4.6" fill="#DCE9FB" stroke="#FFFFFF" stroke-width="1.8"/>
