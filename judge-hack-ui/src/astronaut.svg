    <rect x="33" y="31" width="7.5" height="13" rx="3.75" fill="url(#pack)" stroke="rgba(30,26,52,.26)" stroke-width="1.2"/>
    <rect x="38" y="28" width="15" height="19" rx="7" transform="rotate(6 45.5 37.5)"
