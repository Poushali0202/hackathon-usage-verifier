      <stop offset="1" stop-color="#DE2B15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#F93822"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-34 48 48)">
